name: Release

# Push a tag like v1.0.0 (or publish a release in the GitHub UI) to build everything.
# Needs four repository secrets for the Android signing key - see README.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.10.2"}
      - name: Bundle the web page and its libraries
        run: python3 android/prepare_assets.py --download
      - name: Decode the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing - see README.md"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "AV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the signed APK
        env:
          AV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)           VERSION="0.0.0-dev" ;;
          esac
          gradle -p android assembleRelease -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/AliasVault-${VERSION}.apk"
      - name: Show what the APK is allowed to do
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -n 1)
          "$AAPT" dump permissions out/*.apk || true
          "$APKSIGNER" verify --print-certs out/*.apk | grep -i "sha-256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python build.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir out && cp dist/AliasVault.exe out/AliasVault-windows.exe
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: mkdir out && ditto -c -k --keepParent dist/AliasVault.app out/AliasVault-macos.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: mkdir out && tar czf out/AliasVault-linux.tar.gz -C dist AliasVault
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: out/*

  publish:
    needs: [android, desktop]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Create the release (or add to the one you made in the web UI)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l files
          gh release create "$GITHUB_REF_NAME" files/* --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" files/* --clobber
